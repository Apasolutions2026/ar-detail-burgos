<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel AR Detail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@600;800;900&family=Mulish:wght@400;600;700&family=Rosarivo:ital@1&display=swap">
<style>
/* Layout: panel de taller — cifras del mes arriba, agenda por días debajo, acciones grandes para el móvil */
:root{
  --negro:#0A0A0B;
  --carbon:#131315;
  --carbon-2:#1B1B1E;
  --linea:rgba(255,255,255,.10);
  --blanco:#F5F5F6;
  --texto:#D6D6D9;
  --suave:#9B9BA3;
  --rojo:#E3172B;
  --rojo-claro:#FF4152;
  --verde:#2FBF71;
  --ambar:#F2A93B;
  --azul:#5B9BFF;
  --grad:linear-gradient(135deg,#FF4152 0%,#C3101F 100%);
  --cromo:linear-gradient(180deg,#FFFFFF 0%,#C9CBD0 48%,#7E8189 52%,#E7E8EB 100%);
  --f-display:"Maven Pro",system-ui,"Segoe UI",Arial,sans-serif;
  --f-texto:"Mulish",system-ui,"Segoe UI",Arial,sans-serif;
  --f-serif:"Rosarivo",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--negro);color:var(--texto);font-family:var(--f-texto);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--negro)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);color:var(--blanco);text-transform:uppercase;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--rojo-claro);outline-offset:3px}
.kicker{font-family:var(--f-serif);font-style:italic;color:var(--suave);font-size:16px;margin:0 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border-radius:999px;padding:12px 18px;border:0;cursor:pointer;color:var(--blanco);background:transparent}
.btn-rojo{background:var(--grad);box-shadow:0 8px 24px -10px rgba(227,23,43,.8)}
.btn-linea{border:1px solid rgba(255,255,255,.26)}
.btn-blanco{background:var(--blanco);color:var(--negro)}
.btn-mini{padding:8px 12px;font-size:11px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:17px;height:17px;flex:none}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(10,10,11,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none}
.marca b{font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.04em;background:var(--cromo);-webkit-background-clip:text;background-clip:text;color:transparent}
.marca b i{font-style:normal;color:var(--rojo);-webkit-text-fill-color:var(--rojo)}
.marca span{font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--suave);border-left:1px solid var(--linea);padding-left:10px}
.marca b{white-space:nowrap}
@media (max-width:440px){.top .marca span{display:none}.quien{gap:6px}.quien .btn-mini{padding:8px 10px}}
.quien{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--suave);min-width:0}
.quien em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:22ch}
@media (max-width:560px){.quien em{display:none}}

/* Acceso */
.acceso{min-height:calc(100dvh - 40px);display:grid;place-items:center;padding-block:40px}
.caja{width:min(420px,100%);background:var(--carbon);border:1px solid var(--linea);border-radius:22px;padding:28px}
.caja .marca{flex-direction:column;align-items:flex-start;gap:2px;margin-bottom:22px}
.caja .marca span{border:0;padding:0;letter-spacing:.42em;font-size:9px}
.caja h1{font-size:28px}
.caja p{margin:10px 0 0;color:var(--suave);font-size:15px}
.caja .btn{width:100%;margin-top:14px}
.gbtn{background:#fff;color:#1f1f1f;text-transform:none;letter-spacing:0;font-family:var(--f-texto);font-weight:700;font-size:15px}
.sep{display:flex;align-items:center;gap:12px;color:var(--suave);font-size:13px;margin:20px 0 4px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--linea)}
.campo{display:grid;gap:6px;margin-top:12px}
.campo label{font-size:13px;font-weight:700;color:var(--blanco)}
.campo input,.campo select,.campo textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--linea);background:var(--carbon-2);color:var(--blanco);font:inherit;font-size:16px}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--rojo);outline-offset:0;border-color:transparent}
.enlaces{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.link{background:none;border:0;padding:0;color:var(--texto);font:inherit;font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.3);cursor:pointer}
.err{color:var(--rojo-claro);font-size:14px;min-height:1.2em;margin:10px 0 0}
.ok-msg{color:var(--verde);font-size:14px;margin:10px 0 0}

/* Panel */
main{padding-block:26px 80px}
.demo{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:rgba(242,169,59,.12);border:1px solid rgba(242,169,59,.4);color:#F7C77A;border-radius:14px;padding:12px 16px;font-size:14px;margin-bottom:20px}
.cabeza{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.cabeza h1{font-size:clamp(28px,6vw,40px)}
.mes{display:flex;align-items:center;gap:6px}
.mes button{width:40px;height:40px;border-radius:50%;border:1px solid var(--linea);background:var(--carbon);color:var(--blanco);font-size:18px;cursor:pointer}
.mes b{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--blanco);min-width:9.5em;text-align:center;font-size:14px}
.kpis{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:12px;margin-top:20px}
.kpi{background:var(--carbon);border:1px solid var(--linea);border-radius:16px;padding:16px;min-width:0}
.kpi small{display:block;font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.kpi b{display:block;font-family:var(--f-display);font-weight:900;font-size:30px;color:var(--blanco);line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--suave)}
.kpi.grande{background:linear-gradient(160deg,rgba(227,23,43,.22),rgba(227,23,43,.04) 60%),var(--carbon);border-color:rgba(227,23,43,.45)}
.kpi.grande b{font-size:38px}
.kpi.aviso b{color:var(--ambar)}
@media (max-width:760px){.kpis{grid-template-columns:1fr 1fr}.kpi.grande{grid-column:1/-1}}
.grafica{margin-top:12px;background:var(--carbon);border:1px solid var(--linea);border-radius:16px;padding:16px 16px 10px}
.grafica h2{font-size:13px;letter-spacing:.1em;color:var(--suave);font-weight:800}
.grafica svg{display:block;width:100%;height:130px;margin-top:10px}
.barras{display:flex;justify-content:space-between;font-size:11px;color:var(--suave);font-variant-numeric:tabular-nums}

.bar-acc{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:30px}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtro{font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:9px 14px;border-radius:999px;border:1px solid var(--linea);background:transparent;color:var(--texto);cursor:pointer}
.filtro[aria-pressed="true"]{background:var(--blanco);color:var(--negro);border-color:var(--blanco)}
.filtro i{font-style:normal;opacity:.7;margin-left:4px}

.dia-g{margin-top:22px}
.dia-g h3{font-size:14px;letter-spacing:.08em;color:var(--suave);font-weight:800;padding-bottom:8px;border-bottom:1px solid var(--linea)}
.dia-g h3 b{color:var(--rojo-claro)}
.res{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--linea)}
.res .h{font-family:var(--f-display);font-weight:900;font-size:22px;color:var(--blanco);font-variant-numeric:tabular-nums}
.res .info{min-width:0}
.res .n{font-weight:700;color:var(--blanco);font-size:16px}
.res .s{font-size:14px;color:var(--texto);margin-top:2px}
.res .d{font-size:13px;color:var(--suave);margin-top:4px;overflow-wrap:anywhere}
.res .d a{color:var(--texto)}
.res .acc{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.pendiente{color:var(--ambar);background:rgba(242,169,59,.12)}
.chip.confirmada{color:var(--azul);background:rgba(91,155,255,.12)}
.chip.hecha{color:var(--verde);background:rgba(47,191,113,.12)}
.chip.cancelada{color:var(--suave);background:rgba(255,255,255,.06)}
.res.cancelada .n,.res.cancelada .h{text-decoration:line-through;opacity:.55}
.importe{font-family:var(--f-display);font-weight:900;color:var(--verde);font-size:18px;font-variant-numeric:tabular-nums}
.cobrar{display:flex;gap:6px;align-items:center}
.cobrar input{width:92px;padding:8px 10px;border-radius:10px;border:1px solid var(--linea);background:var(--carbon-2);color:var(--blanco);font:inherit;font-size:16px}
@media (max-width:620px){.res{grid-template-columns:56px 1fr}.res .acc{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;justify-content:flex-start;align-items:center}}
.vacio{margin-top:26px;padding:28px;border:1px dashed var(--linea);border-radius:16px;text-align:center;color:var(--suave)}

dialog{width:min(520px,calc(100% - 24px));max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--linea);border-radius:20px;background:var(--carbon);color:var(--texto)}
dialog::backdrop{background:rgba(0,0,0,.7)}
.dlg{padding:20px;overflow:auto;max-height:calc(100dvh - 26px)}
.dlg header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cerrar{width:36px;height:36px;border-radius:50%;border:1px solid var(--linea);background:transparent;color:var(--blanco);font-size:22px;cursor:pointer}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vistas{display:flex;gap:4px;padding-top:14px;border-bottom:1px solid var(--linea)}
.vista{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:12px 16px;background:none;border:0;border-bottom:3px solid transparent;color:var(--suave);cursor:pointer;margin-bottom:-1px}
.vista[aria-current="page"]{color:var(--blanco);border-bottom-color:var(--rojo)}
.bloque{margin-top:30px}
.tit{font-size:18px;letter-spacing:.04em}
.sub{margin:4px 0 0;color:var(--suave);font-size:14px}
.tit-fila{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.tabla-x{overflow-x:auto;margin-top:12px;border:1px solid var(--linea);border-radius:14px}
.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:460px}
.t th{font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--suave);text-align:left;padding:12px 14px;background:var(--carbon);border-bottom:1px solid var(--linea)}
.t td{padding:11px 14px;border-bottom:1px solid var(--linea);color:var(--texto)}
.t td small{display:block;color:var(--suave);font-size:12px}
.t tbody tr:last-child td{border-bottom:0}
.t tfoot td{font-weight:800;color:var(--blanco);background:var(--carbon);border-top:1px solid var(--linea);border-bottom:0}
.t .num{text-align:right}
.t .fuerte{color:var(--blanco);font-weight:700}
.fila-mes{cursor:pointer}
.fila-mes:hover td{background:rgba(255,255,255,.03)}
.fila-mes.sel td{background:rgba(227,23,43,.12)}
.sube{color:var(--verde);font-weight:700}
.curso{font-size:12px;color:var(--suave);font-style:italic}
@media (max-width:560px){.t .opc{display:none}.t{min-width:0}.kf .kpi:last-child{grid-column:1/-1}}
.baja{color:var(--rojo-claro);font-weight:700}
.srv{display:grid;gap:10px;margin-top:12px}
.srv-f{display:grid;grid-template-columns:minmax(0,1.3fr) 2fr auto;gap:14px;align-items:center;background:var(--carbon);border:1px solid var(--linea);border-radius:12px;padding:12px 14px}
.srv-n b{display:block;color:var(--blanco);font-size:15px}
.srv-n span{font-size:12px;color:var(--suave)}
.srv-b{height:10px;border-radius:10px;background:rgba(255,255,255,.06);overflow:hidden}
.srv-b i{display:block;height:100%;border-radius:10px;background:var(--grad)}
.srv-t{font-family:var(--f-display);font-weight:900;color:var(--blanco);font-size:17px;font-variant-numeric:tabular-nums}
@media (max-width:560px){.srv-f{grid-template-columns:1fr auto}.srv-b{grid-column:1/-1;grid-row:2}}
.meses12{display:grid;grid-template-columns:repeat(12,1fr);text-align:center;font-size:11px;color:var(--suave);text-transform:capitalize}
.meses12 .on{color:var(--blanco);font-weight:700}
.bm{cursor:pointer}
.toast{max-width:calc(100% - 32px);text-align:center;border-radius:18px!important;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--blanco);color:var(--negro);font-weight:700;padding:12px 18px;border-radius:999px;z-index:80;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="app"></div>

<dialog id="cuenta" aria-labelledby="cuenta-t">
  <form class="dlg" id="f-cuenta">
    <header><h2 id="cuenta-t" style="font-size:20px">Cambiar contraseña</h2><button class="cerrar" type="button" aria-label="Cerrar" id="cerrar-c">×</button></header>
    <p id="c-quien" style="margin:0;color:var(--suave);font-size:14px"></p>
    <div id="c-campos">
      <div class="campo"><label for="c-actual">Contraseña actual</label><input id="c-actual" type="password" autocomplete="current-password"></div>
      <div class="campo"><label for="c-nueva">Contraseña nueva</label><input id="c-nueva" type="password" autocomplete="new-password" minlength="6"></div>
      <div class="campo"><label for="c-repite">Repite la nueva</label><input id="c-repite" type="password" autocomplete="new-password" minlength="6"></div>
    </div>
    <p class="err" id="c-err" role="alert"></p>
    <p class="ok-msg" id="c-ok" role="status"></p>
    <button class="btn btn-rojo" type="submit" id="c-guardar" style="width:100%;margin-top:6px">Guardar contraseña nueva</button>
    <button class="btn btn-linea" type="button" id="c-email" style="width:100%;margin-top:10px">Prefiero que me llegue un email para cambiarla</button>
  </form>
</dialog>

<dialog id="nueva" aria-labelledby="nueva-t">
  <form class="dlg" id="f-nueva">
    <header><h2 id="nueva-t" style="font-size:20px">Apuntar reserva</h2><button class="cerrar" type="button" aria-label="Cerrar" id="cerrar-n">×</button></header>
    <p style="margin:0;color:var(--suave);font-size:14px">Para las citas que te piden por teléfono o en persona. Así cuentan en la facturación y la hora queda cogida en la web.</p>
    <div class="dos">
      <div class="campo"><label for="n-fecha">Día</label><input id="n-fecha" type="date" required></div>
      <div class="campo"><label for="n-hora">Hora</label><select id="n-hora"></select></div>
    </div>
    <div class="campo"><label for="n-nombre">Nombre del cliente</label><input id="n-nombre" required maxlength="80"></div>
    <div class="campo"><label for="n-tel">Teléfono</label><input id="n-tel" type="tel" inputmode="tel" maxlength="20"></div>
    <div class="campo"><label for="n-srv">Servicio</label><select id="n-srv"></select></div>
    <div class="dos">
      <div class="campo"><label for="n-coche">Coche</label><input id="n-coche" maxlength="80" placeholder="Marca y modelo"></div>
      <div class="campo"><label for="n-importe">Importe cobrado (€)</label><input id="n-importe" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Si ya está hecho"></div>
    </div>
    <div class="campo"><label for="n-notas">Notas</label><textarea id="n-notas" maxlength="500" rows="2"></textarea></div>
    <p class="err" id="n-err" role="alert"></p>
    <button class="btn btn-rojo" type="submit" style="width:100%;margin-top:6px">Guardar reserva</button>
  </form>
</dialog>

function errAuth(e){
  var c=(e&&e.code)||'';
  if(/wrong-password|invalid-credential|invalid-login|user-not-found/.test(c))return'El email o la contraseña no son correctos.';
  if(/too-many-requests/.test(c))return'Demasiados intentos. Espera unos minutos y vuelve a probar.';
  if(/email-already-in-use/.test(c))return'Ese email ya tiene contraseña. Pulsa "Entrar" o "He olvidado la contraseña".';
  if(/weak-password/.test(c))return'La contraseña tiene que tener al menos 6 caracteres.';
  if(/popup-closed|cancelled-popup/.test(c))return'';
  if(/unauthorized-domain|operation-not-supported|network/.test(c))return'No se puede entrar desde aquí. Abre el panel desde la web de AR Detail.';
  return'No se ha podido entrar. Revisa tu conexión y vuelve a probar.';
}

  else if(a==='nocobrar'){S.cobrando=null;pintar()}
  else if(a==='guardarcobro'){
    var v=parseFloat(String(($('#imp-'+id)||{}).value||'').replace(',','.'));
    if(!(v>=0)){toast('Escribe lo que has cobrado');return}
    S.cobrando=null;cambiar(id,{estado:'hecha',importe:Math.round(v*100)/100}).then(function(){toast('Trabajo hecho: '+eur(v))});
  }else if(a==='cancelar'){
    if(S.armado!==id){S.armado=id;pintar();return}
    S.armado=null;
    var d=deIso(r.fecha),cuando=DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]+' a las '+r.hora+':00';
    var txt='Hola '+String(r.nombre||'').split(' ')[0]+', te escribimos de AR Detail. Lo sentimos mucho, pero tenemos que cancelar tu cita del '+cuando+'. Dinos qué otro día te viene bien y te buscamos hueco. Perdona las molestias.';
    var avisado=false;
    if(r.tel&&!S.demo){window.open('https://wa.me/'+telWa(r.tel)+'?text='+encodeURIComponent(txt),'_blank','noopener');avisado=true}
    cambiar(id,{estado:'cancelada'}).then(function(){return liberarHora(r)}).then(function(){

  }else if(a==='nocancelar'){S.armado=null;pintar()}
  else if(a==='recuperar'){cambiar(id,{estado:'pendiente',importe:null}).then(function(){toast('Reserva recuperada')})}
}

function vFact(){
  var a=S.anio,hoy=new Date(),hechas=S.resAnio.filter(function(r){return r.estado==='hecha'}),
      porMes=[];for(var m=0;m<12;m++)porMes.push({n:0,t:0});
  hechas.forEach(function(r){var m=+r.fecha.slice(5,7)-1;porMes[m].n++;porMes[m].t+=(+r.importe||0)});
  var total=porMes.reduce(function(s,x){return s+x.t},0),trab=hechas.length,
      mejor=porMes.reduce(function(b,x,i){return x.t>b.t?{t:x.t,i:i}:b},{t:0,i:-1}),
      mesesCon=porMes.filter(function(x){return x.n}).length;
  var h=cabecera();
  h+='<div class="cabeza"><div><p class="kicker">Facturación</p><h1>Año '+a+'</h1></div>'+
     '<div class="mes"><button id="a-ant" aria-label="Año anterior">‹</button><b>'+a+'</b><button id="a-sig" aria-label="Año siguiente">›</button></div></div>';
  if(S.cargandoAnio&&!S.resAnio.length)h+='<div class="vacio">Cargando la facturación…</div>';
  h+='<div class="kpis kf">'+
    '<div class="kpi grande"><small>Facturado en '+a+'</small><b>'+eur(total)+'</b><span>'+trab+' '+(trab===1?'trabajo cobrado':'trabajos cobrados')+'</span></div>'+
    '<div class="kpi"><small>Media al mes</small><b>'+(mesesCon?eur(Math.round(total/mesesCon)):'—')+'</b><span>meses con trabajo</span></div>'+
    '<div class="kpi"><small>Ticket medio</small><b>'+(trab?eur(total/trab):'—')+'</b><span>por trabajo</span></div>'+
    '<div class="kpi"><small>Mejor mes</small><b>'+(mejor.i>=0?MESES[mejor.i].charAt(0).toUpperCase()+MESES[mejor.i].slice(1,3):'—')+'</b><span>'+(mejor.i>=0?eur(mejor.t):'sin datos')+'</span></div></div>';
  h+=graficaAnio(porMes);
  // tabla por meses
  h+='<section class="bloque"><h2 class="tit">Mes a mes</h2><p class="sub">Toca un mes para ver sus cobros.</p><div class="tabla-x"><table class="t"><thead><tr><th>Mes</th><th class="num">Trabajos</th><th class="num">Facturado</th><th class="num opc">Ticket medio</th><th class="num opc">Vs. mes anterior</th></tr></thead><tbody>';
  for(var i=0;i<12;i++){
    var x=porMes[i],futuro=a>hoy.getFullYear()||(a===hoy.getFullYear()&&i>hoy.getMonth());if(futuro)break;
    var prev=i?porMes[i-1].t:null,dif=(prev&&x.t)?Math.round((x.t-prev)/prev*100):null,enCurso=a===hoy.getFullYear()&&i===hoy.getMonth();
    h+='<tr class="fila-mes'+(S.mesF===i?' sel':'')+'" data-m="'+i+'" tabindex="0"><td>'+MESES[i].charAt(0).toUpperCase()+MESES[i].slice(1)+'</td><td class="num">'+x.n+'</td><td class="num fuerte">'+eur(x.t)+'</td><td class="num opc">'+(x.n?eur(x.t/x.n):'—')+'</td><td class="num opc">'+(enCurso?'<span class="curso">en curso</span>':dif===null?'—':'<span class="'+(dif>=0?'sube':'baja')+'">'+(dif>=0?'▲ +':'▼ ')+dif+' %</span>')+'</td></tr>';
  }
  h+='</tbody><tfoot><tr><td>Total</td><td class="num">'+trab+'</td><td class="num fuerte">'+eur(total)+'</td><td class="num opc">'+(trab?eur(total/trab):'—')+'</td><td class="opc"></td></tr></tfoot></table></div></section>';
  // por servicio (año)
  var srv={};hechas.forEach(function(r){var k=nombreSrv(r);srv[k]=srv[k]||{n:0,t:0};srv[k].n++;srv[k].t+=(+r.importe||0)});
  var lista=Object.keys(srv).map(function(k){return {k:k,n:srv[k].n,t:srv[k].t}}).sort(function(a,b){return b.t-a.t});
  h+='<section class="bloque"><h2 class="tit">Por servicio</h2><p class="sub">Lo que más te deja en '+a+'.</p>';
  if(!lista.length)h+='<div class="vacio">Todavía no hay trabajos cobrados este año.</div>';
  else{h+='<div class="srv">';lista.forEach(function(x){var pc=total?x.t/total*100:0;
    h+='<div class="srv-f"><div class="srv-n"><b>'+esc(x.k)+'</b><span>'+x.n+' '+(x.n===1?'trabajo':'trabajos')+' · '+Math.round(pc)+' %</span></div><div class="srv-b"><i style="width:'+Math.max(2,pc)+'%"></i></div><div class="srv-t">'+eur(x.t)+'</div></div>';});h+='</div>';}
  h+='</section>';
  // cobros del mes seleccionado
  var m=S.mesF,cob=hechas.filter(function(r){return +r.fecha.slice(5,7)-1===m}).sort(function(a,b){return a.fecha===b.fecha?a.hora-b.hora:(a.fecha<b.fecha?-1:1)});
  h+='<section class="bloque"><div class="tit-fila"><div><h2 class="tit">Cobros de '+MESES[m]+'</h2><p class="sub">'+cob.length+' '+(cob.length===1?'cobro':'cobros')+' · '+eur(porMes[m].t)+'</p></div>'+
     '<button class="btn btn-linea btn-mini" id="csv"'+(cob.length?'':' disabled')+'>Descargar Excel</button></div>';
  if(!cob.length)h+='<div class="vacio">No hay cobros en '+MESES[m]+'.</div>';
  else{h+='<div class="tabla-x"><table class="t"><thead><tr><th>Día</th><th>Cliente</th><th>Servicio</th><th class="num">Importe</th></tr></thead><tbody>';
    cob.forEach(function(r){var d=deIso(r.fecha);h+='<tr><td>'+d.getDate()+' '+MESES[d.getMonth()].slice(0,3)+'</td><td>'+esc(r.nombre)+(r.coche?'<small>'+esc(r.coche)+'</small>':'')+'</td><td>'+esc(nombreSrv(r))+'</td><td class="num fuerte">'+eur(+r.importe||0)+'</td></tr>'});
    h+='</tbody></table></div>';}
  h+='</section>';
  return h+'</main>';
}
function graficaAnio(porMes){
  var W=600,H=150,bw=W/12,max=Math.max.apply(null,porMes.map(function(x){return x.t}))||1,tope=Math.ceil(max/500)*500||500,s='';
  s+='<line x1="0" y1="'+(H-0.5)+'" x2="'+W+'" y2="'+(H-0.5)+'" stroke="rgba(255,255,255,.18)"/>';
  s+='<line x1="0" y1="'+(H/2)+'" x2="'+W+'" y2="'+(H/2)+'" stroke="rgba(255,255,255,.06)" stroke-dasharray="3 4"/>';
  porMes.forEach(function(x,i){var bh=x.t?Math.max(3,(H-18)*x.t/tope):0,sel=i===S.mesF;
    if(bh)s+='<rect class="bm" data-m="'+i+'" x="'+(i*bw+bw*0.16)+'" y="'+(H-bh)+'" width="'+(bw*0.68)+'" height="'+bh+'" rx="3" fill="'+(sel?'#FF4152':'#E3172B')+'" opacity="'+(sel?1:.7)+'"><title>'+MESES[i]+': '+eur(x.t)+'</title></rect>';
    else s+='<rect x="'+(i*bw+bw*0.16)+'" y="'+(H-2)+'" width="'+(bw*0.68)+'" height="2" fill="rgba(255,255,255,.08)"/>';});
  var et=porMes.map(function(x,i){return '<span'+(i===S.mesF?' class="on"':'')+'>'+MESES[i].slice(0,3)+'</span>'}).join('');
  return '<div class="grafica"><h2>Facturado por mes · línea discontinua = '+eur(tope/2)+'</h2><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Facturación por mes">'+s+'</svg><div class="meses12">'+et+'</div></div>';
}
function montarFact(){
  montarCabecera();
  $('#a-ant').onclick=function(){S.anio--;S.mesF=11;S.resAnio=[];escucharAnio();pintar()};
  $('#a-sig').onclick=function(){if(S.anio>=new Date().getFullYear())return;S.anio++;S.mesF=S.anio===new Date().getFullYear()?new Date().getMonth():11;S.resAnio=[];escucharAnio();pintar()};
  document.querySelectorAll('.fila-mes,.bm').forEach(function(el){
    var go=function(){S.mesF=+el.getAttribute('data-m');pintar();var c=document.getElementById('csv');if(c)c.scrollIntoView({block:'center'})};
    el.onclick=go;el.onkeydown=function(e){if(e.key==='Enter')go()};});
  var c=$('#csv');if(c)c.onclick=descargarCSV;
}
function descargarCSV(){
  var m=S.mesF,filas=[['Fecha','Hora','Cliente','Teléfono','Coche','Servicio','Importe (€)']];
  S.resAnio.filter(function(r){return r.estado==='hecha'&&+r.fecha.slice(5,7)-1===m}).sort(function(a,b){return a.fecha<b.fecha?-1:1}).forEach(function(r){
    var d=deIso(r.fecha);filas.push([d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear(),r.hora+':00',r.nombre||'',r.tel||'',r.coche||'',(r.servicios||[]).join(' + '),String(+r.importe||0).replace('.',',')]);});
  var csv='\ufeff'+filas.map(function(f){return f.map(function(c){c=String(c);return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='AR-Detail-facturacion-'+MESES[m]+'-'+S.anio+'.csv';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}

function vRes(r){
  var acc='';
  if(r.estado==='pendiente')acc+='<button class="btn btn-rojo btn-mini" data-a="confirmar" data-id="'+r.id+'"><svg><use href="#i-wa"/></svg>Confirmar</button>';
  if((r.estado==='pendiente'||r.estado==='confirmada')){
    if(S.cobrando===r.id)acc+='<div class="cobrar"><input id="imp-'+r.id+'" type="number" inputmode="decimal" min="0" step="0.01" placeholder="€" aria-label="Importe cobrado en euros"><button class="btn btn-blanco btn-mini" data-a="guardarcobro" data-id="'+r.id+'">OK</button><button class="btn btn-linea btn-mini" data-a="nocobrar" data-id="'+r.id+'">×</button></div>';
    else acc+='<button class="btn btn-linea btn-mini" data-a="cobrar" data-id="'+r.id+'">Hecho y cobrado</button>';
    acc+=S.armado===r.id?'<span style="display:flex;gap:6px"><button class="btn btn-mini" style="background:var(--rojo)" data-a="cancelar" data-id="'+r.id+'">'+(r.tel?'Sí, cancelar y avisar por WhatsApp':'Sí, cancelar')+'</button><button class="btn btn-linea btn-mini" data-a="nocancelar" data-id="'+r.id+'">No</button></span>':'<button class="link" style="font-size:13px" data-a="cancelar" data-id="'+r.id+'">Cancelar cita</button>';
  }
  if(r.estado==='hecha')acc+='<span class="importe">'+eur(+r.importe||0)+'</span><button class="link" style="font-size:13px" data-a="cobrar" data-id="'+r.id+'">Cambiar importe</button>';
  if(r.estado==='hecha'&&S.cobrando===r.id)acc='<div class="cobrar"><input id="imp-'+r.id+'" type="number" inputmode="decimal" min="0" step="0.01" value="'+(+r.importe||0)+'" aria-label="Importe cobrado en euros"><button class="btn btn-blanco btn-mini" data-a="guardarcobro" data-id="'+r.id+'">OK</button><button class="btn btn-linea btn-mini" data-a="nocobrar" data-id="'+r.id+'">×</button></div>';
  if(r.estado==='cancelada')acc+='<button class="link" style="font-size:13px" data-a="recuperar" data-id="'+r.id+'">Recuperar</button>';
  var det=[];
  if(r.tel)det.push('<a href="https://wa.me/'+telWa(r.tel)+'" target="_blank" rel="noopener">'+esc(r.tel)+'</a>');
  if(r.coche)det.push(esc(r.coche));
  if(r.dir)det.push('A domicilio: '+esc(r.dir));
  if(r.origen==='panel')det.push('apuntada por ti');
  return '<div class="res '+r.estado+'"><div class="h">'+r.hora+':00</div><div class="info"><div class="n">'+esc(r.nombre)+' <span class="chip '+r.estado+'">'+r.estado+'</span></div>'+
    '<div class="s">'+esc((r.servicios||[]).join(' · '))+'</div><div class="d">'+det.join(' · ')+'</div>'+(r.notas?'<div class="d">“'+esc(r.notas)+'”</div>':'')+'</div><div class="acc">'+acc+'</div></div>';
}
function grafica(hechas){
  var dias=new Date(S.mes.getFullYear(),S.mes.getMonth()+1,0).getDate(),v=[];for(var i=0;i<dias;i++)v.push(0);
  hechas.forEach(function(r){v[deIso(r.fecha).getDate()-1]+=(+r.importe||0)});
  var max=Math.max.apply(null,v)||1,W=600,H=120,bw=W/dias,s='';
  var tope=Math.ceil(max/50)*50||50;
  s+='<line x1="0" y1="'+(H-0.5)+'" x2="'+W+'" y2="'+(H-0.5)+'" stroke="rgba(255,255,255,.18)"/>';
  s+='<line x1="0" y1="'+(H-H*(tope/2)/tope)+'" x2="'+W+'" y2="'+(H-H*(tope/2)/tope)+'" stroke="rgba(255,255,255,.06)" stroke-dasharray="3 4"/>';
  var hoyD=new Date();
  v.forEach(function(x,i){var bh=x?Math.max(3,H*x/tope):0,esHoy=S.mes.getMonth()===hoyD.getMonth()&&S.mes.getFullYear()===hoyD.getFullYear()&&i===hoyD.getDate()-1;
    if(bh)s+='<rect x="'+(i*bw+bw*0.18)+'" y="'+(H-bh)+'" width="'+(bw*0.64)+'" height="'+bh+'" rx="2" fill="'+(esHoy?'#FF4152':'#E3172B')+'" opacity="'+(esHoy?1:.8)+'"><title>Día '+(i+1)+': '+eur(x)+'</title></rect>';
    else s+='<rect x="'+(i*bw+bw*0.18)+'" y="'+(H-2)+'" width="'+(bw*0.64)+'" height="2" fill="rgba(255,255,255,.08)"/>';});
  return '<div class="grafica"><h2>Facturado por día · máximo '+eur(Math.max.apply(null,v))+'</h2><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Facturación por día del mes">'+s+'</svg><div class="barras"><span>1</span><span>'+Math.ceil(dias/2)+'</span><span>'+dias+'</span></div></div>';
}
function montarPanel(){
  montarCabecera();
  $('#m-ant').onclick=function(){S.mes=new Date(S.mes.getFullYear(),S.mes.getMonth()-1,1);escuchar();pintar()};
  $('#m-sig').onclick=function(){S.mes=new Date(S.mes.getFullYear(),S.mes.getMonth()+1,1);escuchar();pintar()};
  document.querySelectorAll('.filtro').forEach(function(b){b.onclick=function(){S.filtro=b.dataset.f;pintar()}});
  document.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){accion(b.dataset.a,b.dataset.id)}});
  $('#nueva-btn').onclick=abrirNueva;
}

/* ===== Cambiar contraseña ===== */
var dlgC=$('#cuenta');
function tienePw(){var u=AUTH&&AUTH.currentUser;return !!(u&&u.providerData.some(function(p){return p.providerId==='password'}))}
function abrirCuenta(){
  $('#f-cuenta').reset();$('#c-err').textContent='';$('#c-ok').textContent='';
  var demo=S.demo,pw=!demo&&tienePw();
  $('#c-quien').textContent=demo?'En la demostración no se cambia nada. Así es como lo verá el dueño.':pw?'Cuenta: '+S.user.email:'Entras con Google, así que tu contraseña es la de tu cuenta de Google. Si quieres entrar también con email y contraseña, te mandamos un email para crearla.';
  $('#c-campos').hidden=!demo&&!pw;$('#c-guardar').hidden=!demo&&!pw;
  dlgC.showModal?dlgC.showModal():dlgC.setAttribute('open','');
}
$('#cerrar-c').onclick=function(){dlgC.close()};
function errPw(e){var c=(e&&e.code)||'';
  if(/wrong-password|invalid-credential|invalid-login/.test(c))return'La contraseña actual no es correcta.';
  if(/weak-password/.test(c))return'La contraseña nueva tiene que tener al menos 6 caracteres.';
  if(/too-many-requests/.test(c))return'Demasiados intentos. Espera unos minutos y vuelve a probar.';
  if(/requires-recent-login/.test(c))return'Por seguridad, sal y vuelve a entrar, y prueba otra vez.';
  return'No se ha podido cambiar. Revisa tu conexión y vuelve a probar.';}
$('#f-cuenta').onsubmit=function(e){
  e.preventDefault();var err=$('#c-err'),ok=$('#c-ok'),act=$('#c-actual').value,nue=$('#c-nueva').value,rep=$('#c-repite').value;err.textContent='';ok.textContent='';
  if(!act){err.textContent='Escribe tu contraseña actual.';return}
  if(nue.length<6){err.textContent='La contraseña nueva tiene que tener al menos 6 caracteres.';return}
  if(nue!==rep){err.textContent='Las dos contraseñas nuevas no son iguales.';return}
  if(nue===act){err.textContent='La nueva tiene que ser distinta de la actual.';return}
  if(S.demo){ok.textContent='En la demostración no se guarda, pero así funciona.';return}
  var u=AUTH.currentUser,b=$('#c-guardar');b.disabled=true;b.textContent='Guardando…';
  u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,act))
   .then(function(){return u.updatePassword(nue)})
   .then(function(){$('#f-cuenta').reset();ok.textContent='Listo. Desde ahora entras con la contraseña nueva.';toast('Contraseña cambiada')})
   .catch(function(x){err.textContent=errPw(x)})
   .then(function(){b.disabled=false;b.textContent='Guardar contraseña nueva'});
};
$('#c-email').onclick=function(){
  var err=$('#c-err'),ok=$('#c-ok');err.textContent='';ok.textContent='';
  if(S.demo){ok.textContent='En la demostración no se envía nada.';return}
  AUTH.sendPasswordResetEmail(S.user.email).then(function(){ok.textContent='Te hemos enviado un email a '+S.user.email+'. Ábrelo y pon la contraseña nueva. Mira también en spam.'})
   .catch(function(x){err.textContent=/too-many/.test(x.code||'')?'Espera un minuto antes de pedir otro.':'No se ha podido enviar. Revisa tu conexión.'});
};

/* ===== Apuntar reserva a mano ===== */
var dlg=$('#nueva');
$('#n-hora').innerHTML=HORAS.map(function(h){return '<option value="'+h+'">'+h+':00</option>'}).join('');
$('#n-srv').innerHTML=SERVICIOS.map(function(s){return '<option>'+esc(s)+'</option>'}).join('');
function abrirNueva(){$('#f-nueva').reset();$('#n-fecha').value=iso(new Date());$('#n-hora').value='10';$('#n-err').textContent='';dlg.showModal?dlg.showModal():dlg.setAttribute('open','')}
$('#cerrar-n').onclick=function(){dlg.close()};
$('#f-nueva').onsubmit=function(e){
  e.preventDefault();var err=$('#n-err');err.textContent='';
  var f=$('#n-fecha').value,h=+$('#n-hora').value,nom=$('#n-nombre').value.trim(),imp=$('#n-importe').value;
  if(!f||!nom){err.textContent='Pon el día y el nombre del cliente.';return}
  var r={servicios:[$('#n-srv').value],fecha:f,hora:h,nombre:nom.slice(0,80),tel:$('#n-tel').value.trim().slice(0,20),coche:$('#n-coche').value.trim().slice(0,80),dir:'',notas:$('#n-notas').value.trim().slice(0,500),
    estado:imp!==''?'hecha':'confirmada',importe:imp!==''?Math.round(parseFloat(imp.replace(',','.'))*100)/100:null,origen:'panel'};
  if(S.demo){r.id='demo'+Date.now();S.res.push(r);dlg.close();pintar();toast('Reserva apuntada');return}
  var ref=DB.collection('reservas').doc(),oc=DB.collection('ocupado').doc(f+'_'+h);
  oc.get().then(function(d){
    if(d.exists&&!confirm2())return null;
    var b=DB.batch();r.creada=firebase.firestore.FieldValue.serverTimestamp();b.set(ref,r);
    if(!d.exists)b.set(oc,{fecha:f,hora:h,reserva:ref.id});
    return b.commit().then(function(){return true});
  }).then(function(ok){if(ok){dlg.close();toast('Reserva apuntada')}}).catch(function(){err.textContent='No se ha podido guardar. Revisa tu conexión.'});
};
/* Si la hora ya estaba cogida, se apunta igual (pueden caber dos coches) */
function confirm2(){return true}

pintar();
</script>
